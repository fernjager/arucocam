<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
<title id="title">Side view — horiz and vert</title>
<desc id="desc">Side view of a camera, a marker, the horizontal distance, the vertical offset, and the line-of-sight distance.</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 H 0 V 24" fill="none" stroke="#EEF1EC" stroke-width="1"/></pattern><marker id="ah-ink" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#15803D"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B45309"/></marker><marker id="ah-faint" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/></marker></defs>
<rect width="1200" height="840" fill="#F5F6F2"/>
<text x="48" y="54" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="29" fill="#0F172A" font-weight="700" text-anchor="start" letter-spacing="-0.6">Side view — horiz and vert</text><text x="48" y="84" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#64748B" font-weight="400" text-anchor="start">Both are measured from the camera's optical centre. horiz lies in the camera's horizontal plane; vert is positive up.</text><rect x="1032" y="34" width="120" height="26" rx="13" fill="#EFF6FF" stroke="#2563EB" stroke-opacity="0.28"/><text x="1092" y="51.5" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#2563EB" font-weight="700" text-anchor="middle" letter-spacing="1.4">SIDE VIEW</text>
<rect x="40" y="110" width="860" height="690" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="41" y="111" width="858" height="688" rx="17" fill="url(#grid)" opacity="0.55"/>
<path d="M 92 200 H 146" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#ah-faint)"/>
<path d="M 92 200 V 146" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#ah-faint)"/>
<text x="150" y="204" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#64748B" font-weight="700" text-anchor="start">x</text>
<text x="92" y="138" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#64748B" font-weight="700" text-anchor="middle">z</text>
<text x="92" y="220" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#94A3B8" font-weight="400" text-anchor="start">camera axes</text>
<path d="M 200 610 H 850" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="7 6"/>
<text x="850" y="592" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#64748B" font-weight="400" text-anchor="end">camera horizontal plane (z = 0)</text>
<path d="M 660 610 V 718" stroke="#B45309" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.8"/>
<circle cx="660" cy="610" r="2.6" fill="#B45309"/>
<g opacity="0.55"><rect x="640" y="710" width="40" height="40" rx="2" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="645.6" y="715.6" width="28.8" height="28.8" fill="#FFFFFF"/><rect x="645.6" y="715.6" width="7.2" height="7.2" fill="#B45309"/><rect x="660" y="715.6" width="7.2" height="7.2" fill="#B45309"/><rect x="660" y="722.8" width="7.2" height="7.2" fill="#B45309"/><rect x="645.6" y="730" width="7.2" height="7.2" fill="#B45309"/><rect x="667.2" y="730" width="7.2" height="7.2" fill="#B45309"/><rect x="652.8" y="737.2" width="7.2" height="7.2" fill="#B45309"/><rect x="667.2" y="737.2" width="7.2" height="7.2" fill="#B45309"/></g>
<text x="690" y="726" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#B45309" font-weight="700" text-anchor="start">vert &lt; 0</text>
<text x="690" y="742" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#B45309" font-weight="400" text-anchor="start" opacity="0.85">below the plane</text>
<path d="M 200 610 L 720 310" stroke="#2563EB" stroke-width="2.5"/>
<text x="451" y="442" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#2563EB" font-weight="600" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke" transform="rotate(-29.98 451 442)">slant = hypot(horiz, vert)</text>
<path d="M 340 610 A 140 140 0 0 0 321.27 540.04" fill="none" stroke="#15803D" stroke-width="2" marker-end="url(#ah-green)"/>
<text x="360.35" y="572.06" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#15803D" font-weight="800" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">φ</text>
<path d="M 200 650 H 720" stroke="#334155" stroke-width="1.4" marker-start="url(#ah-ink)" marker-end="url(#ah-ink)"/>
<path d="M 200 615 V 661 M 720 615 V 661" stroke="#E2E8F0" stroke-width="1"/>
<text x="460" y="680" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#0F172A" font-weight="700" text-anchor="middle">horiz</text>
<text x="460" y="698" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#64748B" font-weight="400" text-anchor="middle">in the camera's horizontal plane</text>
<path d="M 770 310 V 610" stroke="#15803D" stroke-width="1.4" marker-start="url(#ah-green)" marker-end="url(#ah-green)"/>
<path d="M 725 310 H 781 M 725 610 H 781" stroke="#BBF7D0" stroke-width="1"/>
<text x="784" y="456" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#15803D" font-weight="700" text-anchor="start">vert</text>
<text x="784" y="474" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#15803D" font-weight="400" text-anchor="start">positive up</text>
<g><rect x="688" y="278" width="64" height="64" rx="2" fill="#FFFFFF" stroke="#111827" stroke-width="1.5"/><rect x="696.96" y="286.96" width="46.08" height="46.08" fill="#FFFFFF"/><rect x="696.96" y="286.96" width="11.52" height="11.52" fill="#111827"/><rect x="720" y="286.96" width="11.52" height="11.52" fill="#111827"/><rect x="720" y="298.48" width="11.52" height="11.52" fill="#111827"/><rect x="696.96" y="310" width="11.52" height="11.52" fill="#111827"/><rect x="731.52" y="310" width="11.52" height="11.52" fill="#111827"/><rect x="708.48" y="321.52" width="11.52" height="11.52" fill="#111827"/><rect x="731.52" y="321.52" width="11.52" height="11.52" fill="#111827"/></g>
<text x="720" y="264" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#0F172A" font-weight="700" text-anchor="middle">marker 7</text>
<circle cx="720" cy="610" r="3.5" fill="#334155"/>
<rect x="112" y="576" width="82" height="68" rx="11" fill="#1E293B" stroke="#0F172A" stroke-width="1.5"/><rect x="122" y="586" width="62" height="48" rx="7" fill="#334155"/><circle cx="200" cy="610" r="21" fill="#0B1220" stroke="#475569" stroke-width="2"/><circle cx="200" cy="610" r="13" fill="#1E293B"/><circle cx="196" cy="606" r="4" fill="#64748B" opacity="0.8"/>
<circle cx="200" cy="610" r="4.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
<text x="172" y="690" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#334155" font-weight="700" text-anchor="middle">camera</text>
<text x="172" y="706" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#64748B" font-weight="400" text-anchor="middle">origin at optical centre</text>
<text x="872" y="782" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#94A3B8" font-weight="400" text-anchor="end">side view · not to scale</text>
<rect x="924" y="110" width="236" height="232" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><text x="942" y="135" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#64748B" font-weight="700" text-anchor="start" letter-spacing="1.4">MEASUREMENTS</text><path d="M 942 146 H 1142" stroke="#E2E8F0" stroke-width="1"/>
<rect x="942" y="166" width="4" height="38" rx="2" fill="#0F172A"/>
<text x="958" y="181" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start" >horiz</text>
<text x="958" y="198" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#64748B" font-weight="400" text-anchor="start">horizontal distance in</text>
<text x="958" y="212" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#64748B" font-weight="400" text-anchor="start">the camera's horizontal plane</text>
<rect x="942" y="224" width="4" height="38" rx="2" fill="#15803D"/>
<text x="958" y="239" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#15803D" text-anchor="start" >vert</text>
<text x="958" y="256" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#64748B" font-weight="400" text-anchor="start">vertical offset from the</text>
<text x="958" y="270" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#64748B" font-weight="400" text-anchor="start">camera; positive up</text>
<rect x="942" y="282" width="4" height="38" rx="2" fill="#2563EB"/>
<text x="958" y="297" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#2563EB" text-anchor="start" >slant</text>
<text x="958" y="314" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#64748B" font-weight="400" text-anchor="start">true 3D distance;</text>
<text x="958" y="328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#64748B" font-weight="400" text-anchor="start">hypot(horiz, vert)</text>
<rect x="924" y="358" width="236" height="190" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><text x="942" y="383" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#64748B" font-weight="700" text-anchor="start" letter-spacing="1.4">RELATIONSHIPS</text><path d="M 942 394 H 1142" stroke="#E2E8F0" stroke-width="1"/>
<text x="942" y="414" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="600" fill="#334155" text-anchor="start" >slant = hypot(horiz, vert)</text>
<text x="942" y="443" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="600" fill="#334155" text-anchor="start" >φ = atan2(vert, horiz)</text>
<text x="942" y="472" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="600" fill="#334155" text-anchor="start" >vert = slant · sin φ</text>
<text x="942" y="501" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="600" fill="#334155" text-anchor="start" >horiz = slant · cos φ</text>
<text x="942" y="532" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#94A3B8" font-weight="400" text-anchor="start">φ is elevation above the plane.</text>
<rect x="924" y="564" width="236" height="150" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><text x="942" y="589" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#64748B" font-weight="700" text-anchor="start" letter-spacing="1.4">NOTE</text><path d="M 942 600 H 1142" stroke="#E2E8F0" stroke-width="1"/>
<text x="942" y="614" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#64748B" font-weight="400" text-anchor="start">vert is not height above the floor.</text>
<text x="942" y="635" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#64748B" font-weight="400" text-anchor="start">horiz is not the straight-line</text>
<text x="942" y="656" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#64748B" font-weight="400" text-anchor="start">distance.</text>
<text x="942" y="677" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#64748B" font-weight="400" text-anchor="start">Origin: the camera's optical centre.</text>
<text x="924" y="744" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#94A3B8" font-weight="400" text-anchor="start">The true 3D distance is the</text>
<text x="924" y="760" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#94A3B8" font-weight="400" text-anchor="start">line-of-sight length.</text>
</svg>
